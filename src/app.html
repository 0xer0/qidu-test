<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>默契度测试 · 你们到底有多懂对方</title>
<meta name="description" content="出 10 道题考考你朋友，看谁更懂谁。零注册，点开链接就能答，60 秒出分。">
<meta property="og:type" content="website">
<meta property="og:title" content="默契度测试 · 你们到底有多懂对方">
<meta property="og:description" content="我出了一套默契度测试，来答一下，看看我们有多懂对方。">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫂</text></svg>">
<style>
:root{
  --bg:#08070d; --bg2:#0c0b14; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#f4f3f8; --muted:#9b98ac; --dim:#6f6c80;
  --a1:#7c5cff; --a2:#ff5c8a; --a3:#ffb347; --ok:#3ddc97; --no:#ff6b6b;
  --grad:linear-gradient(135deg,#7c5cff 0%,#ff5c8a 55%,#ffb347 100%);
  --r:20px; --sh:0 18px 60px -20px rgba(0,0,0,.9);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  min-height:100svh; overflow-x:hidden; line-height:1.55;
  display:flex; flex-direction:column; align-items:center;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
/* ---------- 背景 ---------- */
.orbs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:var(--bg)}
.orbs i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.5}
.orbs i:nth-child(1){width:60vw;height:60vw;background:#5b3cff;top:-18vw;left:-16vw}
.orbs i:nth-child(2){width:52vw;height:52vw;background:#ff3d78;top:24vh;right:-20vw;opacity:.34}
.orbs i:nth-child(3){width:46vw;height:46vw;background:#ff9c2e;bottom:-14vh;left:6vw;opacity:.22}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 12%,#000 0%,transparent 72%);}
/* ---------- 布局 ---------- */
.wrap{width:100%;max-width:480px;padding:28px 20px 48px;flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:26px}
.brand b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px #ff5c8a}
.view{display:flex;flex-direction:column;gap:18px;animation:in .42s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:34px;line-height:1.22;margin:0;letter-spacing:-.02em;font-weight:700}
h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:14.5px;margin:0}
.tiny{font-size:12px;color:var(--dim);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.flat{background:transparent;border-color:rgba(255,255,255,.07)}
/* ---------- 按钮 ---------- */
.btn{
  appearance:none;border:0;font:inherit;font-weight:600;font-size:16px;cursor:pointer;
  padding:15px 20px;border-radius:15px;width:100%;color:#fff;background:var(--grad);
  box-shadow:0 12px 30px -12px rgba(255,92,138,.75), inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .12s ease,filter .2s ease,opacity .2s;display:flex;align-items:center;justify-content:center;gap:9px;
  letter-spacing:.01em;
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:active{background:rgba(255,255,255,.11)}
.btn.sm{font-size:14.5px;padding:12px 16px;border-radius:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* ---------- 输入 ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--muted)}
input[type=text]{
  font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.32);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;outline:0;
  transition:border-color .2s,box-shadow .2s;
}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{border-color:rgba(124,92,255,.8);box-shadow:0 0 0 4px rgba(124,92,255,.16)}
/* ---------- 题库选择 ---------- */
.decks{display:flex;flex-direction:column;gap:11px}
.deck{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;
  font:inherit;color:inherit;transition:transform .14s ease,border-color .2s,background .2s;
}
.deck:active{transform:scale(.98)}
.deck:hover{border-color:var(--line2);background:var(--card2)}
.deck .ico{font-size:24px;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.06);flex:none}
.deck .tx{flex:1;min-width:0}
.deck .tx b{display:block;font-size:15.5px;font-weight:650}
.deck .tx span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .arw{color:var(--dim);font-size:16px}
/* ---------- 玩法步骤 ---------- */
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start}
.step::before{
  counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(255,92,138,.9));
  box-shadow:0 6px 16px -6px rgba(255,92,138,.9);
}
.step p{margin:0;font-size:13.5px;color:var(--muted);padding-top:1px}
.step p b{color:var(--ink);font-weight:600}
/* ---------- 答题 ---------- */
.quizbar{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.quizbar .pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quizbar .bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.quizbar .bar i{display:block;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width .38s cubic-bezier(.22,1,.36,1)}
.qtitle{font-size:22px;line-height:1.44;font-weight:650;letter-spacing:-.01em;margin:14px 0 8px}
.qhint{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;width:100%;
  transition:border-color .16s,background .16s,transform .12s;
  position:relative;overflow:hidden;
}
.opt .em{font-size:20px;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.06)}
.opt .tx{flex:1;font-size:15px;line-height:1.4}
.opt .k{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--line2);background:var(--card2)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:transparent;background:linear-gradient(rgba(124,92,255,.22),rgba(255,92,138,.18));box-shadow:0 0 0 1.5px rgba(255,92,138,.75),0 10px 30px -14px rgba(255,92,138,.9)}
.opt.on .em{background:rgba(255,255,255,.14)}
.opt .tick{margin-left:2px;color:#fff;opacity:0;transition:opacity .18s,transform .18s;transform:scale(.6)}
.opt.on .tick{opacity:1;transform:none}
.nav{display:flex;gap:10px;margin-top:4px}
.nav .btn{flex:0 0 auto;width:auto;padding-inline:18px}
/* ---------- 分享 ---------- */
.linkbox{background:rgba(0,0,0,.34);border:1px dashed rgba(255,255,255,.16);border-radius:13px;padding:12px 13px;font-size:11px;color:var(--muted);word-break:break-all;max-height:96px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:16px;width:max-content;margin:0 auto}
.qr canvas{display:block;width:152px;height:152px;image-rendering:pixelated}
.qr.fail{background:var(--card);color:var(--muted);font-size:12px;padding:18px;width:100%;text-align:center}
.copytoast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#fff;color:#111;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;box-shadow:0 16px 40px -12px rgba(0,0,0,.8)}
.copytoast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- 结果 ---------- */
.scorewrap{display:grid;place-items:center;position:relative;padding:8px 0 2px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#gr);stroke-dasharray:0 999;transition:stroke-dasharray 1.15s cubic-bezier(.22,1,.36,1)}
.scorenum{position:absolute;display:flex;flex-direction:column;align-items:center;gap:0}
.scorenum b{font-size:58px;line-height:1;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.scorenum span{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-top:6px}
.tier{text-align:center}
.tier b{display:block;font-size:23px;font-weight:700;letter-spacing:-.01em}
.tier p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.metrics{display:flex;gap:10px}
.metric{flex:1;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:center}
.metric b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.qrs{display:flex;flex-direction:column;gap:10px}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
.qrow .qh{display:flex;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:10px;align-items:baseline}
.qrow .qh i{font-style:normal;color:var(--dim);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.qrow .qh b{color:var(--ink);font-weight:550;line-height:1.4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:rgba(0,0,0,.26);border-radius:11px;padding:9px 10px;font-size:12.5px;line-height:1.45}
.side .who{font-size:10.5px;color:var(--dim);display:block;margin-bottom:3px;letter-spacing:.03em}
.side .val{display:flex;gap:5px;align-items:flex-start}
.side .val em{font-style:normal}
.mark{font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;flex:none;margin-left:auto;align-self:flex-start}
.mark.y{color:#08130d;background:var(--ok)}
.mark.n{color:#1a0808;background:rgba(255,107,107,.85)}
/* ---------- 海报 ---------- */
#poster{position:fixed;left:-9999px;top:0;width:1080px;height:1440px}
/* ---------- 页脚 ---------- */
.foot{margin-top:auto;padding-top:26px;display:flex;justify-content:center;gap:14px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.12)}
.hist{display:flex;flex-direction:column;gap:1px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.055);color:var(--muted)}
.hist div:last-child{border:0}
.hist b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#ffd9a8;background:rgba(255,179,71,.13);border:1px solid rgba(255,179,71,.28);border-radius:99px;padding:4px 10px}
@media (hover:none){.opt .k{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){h1{font-size:29px}.qtitle{font-size:20px}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<div class="grid"></div>
<div class="wrap">
  <div class="brand"><span class="dot"></span><b>默契度测试</b><span>·</span><span id="branddeck">双人互猜</span></div>
  <div id="app"></div>
  <div class="foot">
    <span>不上传任何数据 · 只存你的手机里</span>
    <a href="#/" id="foothelp">怎么玩</a>
  </div>
</div>
<div class="copytoast" id="toast">已复制</div>
<canvas id="poster" width="1080" height="1440"></canvas>
<script>/*@QR@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
