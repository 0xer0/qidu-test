<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#08070d; --bg2:#0c0b14; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#f4f3f8; --muted:#9b98ac; --dim:#6f6c80;
  --a1:#7c5cff; --a2:#ff5c8a; --a3:#ffb347; --ok:#3ddc97; --no:#ff6b6b;
  --grad:linear-gradient(135deg,#7c5cff 0%,#ff5c8a 55%,#ffb347 100%);
  --r:20px; --sh:0 18px 60px -20px rgba(0,0,0,.9);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  min-height:100svh; overflow-x:hidden; line-height:1.55;
  display:flex; flex-direction:column; align-items:center;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
/* ---------- 背景 ---------- */
.orbs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:var(--bg)}
.orbs i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.5}
.orbs i:nth-child(1){width:60vw;height:60vw;background:#5b3cff;top:-18vw;left:-16vw}
.orbs i:nth-child(2){width:52vw;height:52vw;background:#ff3d78;top:24vh;right:-20vw;opacity:.34}
.orbs i:nth-child(3){width:46vw;height:46vw;background:#ff9c2e;bottom:-14vh;left:6vw;opacity:.22}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 12%,#000 0%,transparent 72%);}
/* ---------- 布局 ---------- */
.wrap{width:100%;max-width:480px;padding:28px 20px 48px;flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:26px}
.brand b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px #ff5c8a}
.view{display:flex;flex-direction:column;gap:18px;animation:in .42s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:34px;line-height:1.22;margin:0;letter-spacing:-.02em;font-weight:700}
h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:14.5px;margin:0}
.tiny{font-size:12px;color:var(--dim);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.flat{background:transparent;border-color:rgba(255,255,255,.07)}
/* ---------- 按钮 ---------- */
.btn{
  appearance:none;border:0;font:inherit;font-weight:600;font-size:16px;cursor:pointer;
  padding:15px 20px;border-radius:15px;width:100%;color:#fff;background:var(--grad);
  box-shadow:0 12px 30px -12px rgba(255,92,138,.75), inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .12s ease,filter .2s ease,opacity .2s;display:flex;align-items:center;justify-content:center;gap:9px;
  letter-spacing:.01em;
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:active{background:rgba(255,255,255,.11)}
.btn.sm{font-size:14.5px;padding:12px 16px;border-radius:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* ---------- 输入 ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:var(--muted)}
input[type=text]{
  font:inherit;font-size:16px;color:var(--ink);background:rgba(0,0,0,.32);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;outline:0;
  transition:border-color .2s,box-shadow .2s;
}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{border-color:rgba(124,92,255,.8);box-shadow:0 0 0 4px rgba(124,92,255,.16)}
/* ---------- 题库选择 ---------- */
.decks{display:flex;flex-direction:column;gap:11px}
.deck{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;
  font:inherit;color:inherit;transition:transform .14s ease,border-color .2s,background .2s;
}
.deck:active{transform:scale(.98)}
.deck:hover{border-color:var(--line2);background:var(--card2)}
.deck .ico{font-size:24px;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.06);flex:none}
.deck .tx{flex:1;min-width:0}
.deck .tx b{display:block;font-size:15.5px;font-weight:650}
.deck .tx span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .arw{color:var(--dim);font-size:16px}
/* ---------- 玩法步骤 ---------- */
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start}
.step::before{
  counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.9),rgba(255,92,138,.9));
  box-shadow:0 6px 16px -6px rgba(255,92,138,.9);
}
.step p{margin:0;font-size:13.5px;color:var(--muted);padding-top:1px}
.step p b{color:var(--ink);font-weight:600}
/* ---------- 答题 ---------- */
.quizbar{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.quizbar .pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quizbar .bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.quizbar .bar i{display:block;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width .38s cubic-bezier(.22,1,.36,1)}
.qtitle{font-size:22px;line-height:1.44;font-weight:650;letter-spacing:-.01em;margin:14px 0 8px}
.qhint{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 15px;width:100%;
  transition:border-color .16s,background .16s,transform .12s;
  position:relative;overflow:hidden;
}
.opt .em{font-size:20px;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.06)}
.opt .tx{flex:1;font-size:15px;line-height:1.4}
.opt .k{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--line2);background:var(--card2)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:transparent;background:linear-gradient(rgba(124,92,255,.22),rgba(255,92,138,.18));box-shadow:0 0 0 1.5px rgba(255,92,138,.75),0 10px 30px -14px rgba(255,92,138,.9)}
.opt.on .em{background:rgba(255,255,255,.14)}
.opt .tick{margin-left:2px;color:#fff;opacity:0;transition:opacity .18s,transform .18s;transform:scale(.6)}
.opt.on .tick{opacity:1;transform:none}
.nav{display:flex;gap:10px;margin-top:4px}
.nav .btn{flex:0 0 auto;width:auto;padding-inline:18px}
/* ---------- 分享 ---------- */
.linkbox{background:rgba(0,0,0,.34);border:1px dashed rgba(255,255,255,.16);border-radius:13px;padding:12px 13px;font-size:11px;color:var(--muted);word-break:break-all;max-height:96px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:16px;width:max-content;margin:0 auto}
.qr canvas{display:block;width:152px;height:152px;image-rendering:pixelated}
.qr.fail{background:var(--card);color:var(--muted);font-size:12px;padding:18px;width:100%;text-align:center}
.copytoast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#fff;color:#111;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;box-shadow:0 16px 40px -12px rgba(0,0,0,.8)}
.copytoast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- 结果 ---------- */
.scorewrap{display:grid;place-items:center;position:relative;padding:8px 0 2px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#gr);stroke-dasharray:0 999;transition:stroke-dasharray 1.15s cubic-bezier(.22,1,.36,1)}
.scorenum{position:absolute;display:flex;flex-direction:column;align-items:center;gap:0}
.scorenum b{font-size:58px;line-height:1;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.scorenum span{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-top:6px}
.tier{text-align:center}
.tier b{display:block;font-size:23px;font-weight:700;letter-spacing:-.01em}
.tier p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.metrics{display:flex;gap:10px}
.metric{flex:1;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:center}
.metric b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.qrs{display:flex;flex-direction:column;gap:10px}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}
.qrow .qh{display:flex;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:10px;align-items:baseline}
.qrow .qh i{font-style:normal;color:var(--dim);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.qrow .qh b{color:var(--ink);font-weight:550;line-height:1.4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{background:rgba(0,0,0,.26);border-radius:11px;padding:9px 10px;font-size:12.5px;line-height:1.45}
.side .who{font-size:10.5px;color:var(--dim);display:block;margin-bottom:3px;letter-spacing:.03em}
.side .val{display:flex;gap:5px;align-items:flex-start}
.side .val em{font-style:normal}
.mark{font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;flex:none;margin-left:auto;align-self:flex-start}
.mark.y{color:#08130d;background:var(--ok)}
.mark.n{color:#1a0808;background:rgba(255,107,107,.85)}
/* ---------- 海报 ---------- */
#poster{position:fixed;left:-9999px;top:0;width:1080px;height:1440px}
/* ---------- 页脚 ---------- */
.foot{margin-top:auto;padding-top:26px;display:flex;justify-content:center;gap:14px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.12)}
.hist{display:flex;flex-direction:column;gap:1px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.055);color:var(--muted)}
.hist div:last-child{border:0}
.hist b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#ffd9a8;background:rgba(255,179,71,.13);border:1px solid rgba(255,179,71,.28);border-radius:99px;padding:4px 10px}
@media (hover:none){.opt .k{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){h1{font-size:29px}.qtitle{font-size:20px}}
</style>
</head>

</div>
<div class="copytoast" id="toast">已复制</div>

/* ---------------- 编码：链接里塞答案 ---------------- */
function crc8(bytes) {
  let c = 0;
  for (const b of bytes) {
    c ^= b;
    for (let i = 0; i < 8; i++) c = (c & 1) ? ((c >> 1) ^ 0x8C) : (c >> 1);
  }
  return c & 0xFF;
}
function b64u(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(str) {
  const s = str.replace(/-/g, '+').replace(/_/g, '/');
  const pad = s.length % 4 ? 4 - (s.length % 4) : 0;
  const raw = atob(s + '='.repeat(pad));
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
/* 二进制打包：type(1) ver(1) deck(1) [昵称长(1) 昵称(n) 答案(2*ceil(q/4))] * 人数 crc(1)
   每题 2 bit，10 题 = 3 字节，两人结果整体约 22 字节 -> 链接短、二维码好扫 */
const ENC_VER = 2;
const normName = x => String((x && typeof x === 'string' ? x : '') || '对方').slice(0, 14);
const packAnswers = (s, g) => {
  const all = s.concat(g);
  const out = new Uint8Array(Math.ceil(all.length / 4));
  for (let i = 0; i < all.length; i++) out[i >> 2] |= (all[i] & 3) << ((i & 3) * 2);
  return out;
};
function readAnswers(buf, off, count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const byte = i >> 2;
    if (off + byte >= buf.length) return null;
    out.push((buf[off + byte] >> ((i & 3) * 2)) & 3);
  }
  return out;
}
function seal(parts) {
  const len = parts.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(len + 1);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  out[len] = crc8(out.subarray(0, len));
  return b64u(out);
}
function buildSide(deckId, side) {
  const nick = new TextEncoder().encode(normName(side.n)).subarray(0, 36);
  return [
    new Uint8Array([nick.length]), nick,
    packAnswers(side.s, side.g)
  ];
}
function encInvite(deckId, nick, s, g) {
  const dIdx = Math.max(0, DECKS.findIndex(d => d.id === deckId));
  return seal([new Uint8Array([1, ENC_VER, dIdx]), ...buildSide(deckId, { n: nick, s, g })]);
}
function encResult(deckId, host, guest) {
  const dIdx = Math.max(0, DECKS.findIndex(d => d.id === deckId));
  return seal([new Uint8Array([2, ENC_VER, dIdx]), ...buildSide(deckId, host), ...buildSide(deckId, guest)]);
}
function openSealed(str) {
  try {
    const all = unb64u(str);
    if (all.length < 5) return null;
    const body = all.subarray(0, all.length - 1);
    if (crc8(body) !== all[all.length - 1]) return null;
    if (body[1] !== ENC_VER) return null;
    const deck = DECKS[body[2]];
    if (!deck) return null;
    return { body, deck, type: body[0] };
  } catch (e) { return null; }
}
function readSide(body, off, count) {
  if (off >= body.length) return null;
  const nl = body[off++];
  if (off + nl > body.length) return null;
  const n = new TextDecoder().decode(body.subarray(off, off + nl)) || '对方';
  off += nl;
  const vals = readAnswers(body, off, count * 2);   // s 与 g 连续打包
  off += Math.ceil(count * 2 / 4);
  if (!vals) return null;
  return { side: { n, s: vals.slice(0, count), g: vals.slice(count) }, off };
}
/** 邀请：出题人的一份答案 */
function unpack(str) {
  const o = openSealed(str);
  if (!o || o.type !== 1) return null;
  const r = readSide(o.body, 3, o.deck.qs.length);
  if (!r) return null;
  return { v: ENC_VER, deck: o.deck.id, n: r.side.n, s: r.side.s, g: r.side.g };
}
/** 结果：两个人的答案 */
function unpackResult(str) {
  const o = openSealed(str);
  if (!o || o.type !== 2) return null;
  const n = o.deck.qs.length;
  const a = readSide(o.body, 3, n);
  if (!a) return null;
  const b = readSide(o.body, a.off, n);
  if (!b) return null;
  return { deck: o.deck.id, h: a.side, u: b.side };
}

/* ---------------- 计分 ---------------- */
function scoreOf(host, guest, deck) {
  const n = deck.qs.length;
  let aHit = 0, bHit = 0, same = 0;
  const rows = deck.qs.map((item, i) => {
    const aReal = host.s[i], aGuess = host.g[i];
    const bReal = guest.s[i], bGuess = guest.g[i];
    const A = aGuess === bReal;   // host 猜中 guest
    const B = bGuess === aReal;   // guest 猜中 host
    if (A) aHit++;
    if (B) bHit++;
    if (aReal === bReal) same++;
    return { i, q: item.q, o: item.o, aReal, aGuess, bReal, bGuess, A, B };
  });
  const score = Math.round((aHit + bHit) / (2 * n) * 100);
  const sim = Math.round(same / n * 100);
  return { score, sim, aHit, bHit, n, rows };
}
function tierOf(score, sim) {
  if (score >= 90) return { t: '灵魂同频', d: '你们不是默契，是共用一套神经系统。', e: '🫂' };
  if (score >= 75) return { t: '老友无疑', d: '不用说话也知道对方下一步要干嘛。', e: '🔥' };
  if (score >= 60) return { t: '默契搭子', d: '大体上懂，细节上各玩各的。', e: '🙂' };
  if (score >= 40) return { t: '还在熟悉', d: '别慌，很多朋友都是从互相猜错开始的。', e: '😅' };
  return { t: '塑料情谊', d: '你们可能只是恰好认识，但这也挺好笑的。', e: '🧊' };
}

          <div class="side"><span class="who">${esc(b.n)} 猜 TA</span><span class="val"><em>${row.o[row.bGuess][1]}</em>${esc(row.o[row.bGuess][0])}<span class="mark ${row.B ? 'y' : 'n'}">${row.B ? '中' : '错'}</span></span></div>
          <div class="side"><span class="who">${esc(b.n)} 真实选</span><span class="val"><em>${row.o[row.bReal][1]}</em>${esc(row.o[row.bReal][0])}</span></div>
          <div class="side"><span class="who">${esc(a.n)} 猜 TA</span><span class="val"><em>${row.o[row.aGuess][1]}</em>${esc(row.o[row.aGuess][0])}<span class="mark ${row.A ? 'y' : 'n'}">${row.A ? '中' : '错'}</span></span></div>
        </div>
      </div>`).join('')}
  </div>
  ${S.role === 'guest'
    ? `<button class="btn" data-act="sendresult">把结果发给 ${esc(a.n)}</button>`
    : `<button class="btn" data-act="turn">换我出一套题考 ${esc(b.n)}</button>`}
  <div class="row">
    <button class="btn ghost sm" data-act="poster">保存战绩图</button>
    <button class="btn ghost sm" data-act="again">再来一局</button>
  </div>
  <p class="tiny">${S.role === 'guest' ? '发出去的链接包含你们两人的答案，只为让他看到同一个结果。' : '这是你们这局的完整记录，链接本身就是结果，存下来随时能看。'}</p>`;
}

/* ---- 结果动画 ---- */
function animateRing() {
  const r = S.result; if (!r) return;
  const ring = $('#fgring'), num = $('#scorenum');
  if (!ring || !num) return;
  const R = 84, C = 2 * Math.PI * R;
  ring.style.strokeDasharray = `0 ${C}`;
  requestAnimationFrame(() => { ring.style.strokeDasharray = `${C * r.score / 100} ${C}`; });
  const t0 = performance.now(), dur = 1100;
  const tick = now => {
    const p = clamp((now - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    num.textContent = Math.round(r.score * e);
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------------- 二维码 ---------------- */
function drawQR(canvas, text, px) {
  try {
    if (typeof qrcode !== 'function') return false;
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const pad = 2;
    const cell = Math.max(1, Math.floor((px - pad * 2) / n));
    const size = cell * n + pad * 2;
    canvas.width = size; canvas.height = size;
    canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(pad + c * cell, pad + r * cell, cell, cell);
    }
    return true;
  } catch (e) { return false; }
}
function drawShareQR() {
  const box = $('#qrbox'), cv = $('#qrc');
  if (!box || !cv) return;
  if (!drawQR(cv, S.shareLink, 152)) {
    box.classList.add('fail');
    box.textContent = '二维码加载失败，用下面的链接也行';
  }
}

/* ---------------- 剪贴板 / 分享 ---------------- */
async function copyText(text, okMsg) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast(okMsg || '已复制');
  } catch (e) { toast('复制失败，长按手动复制'); }
}

/* ---------------- 海报 ---------------- */
function makePoster() {
  const cv = $('#poster'), ctx = cv.getContext('2d');
  const W = 1080, H = 1440;
  const r = S.result, d = DECK(S.deckId), t = tierOf(r.score, r.sim);
  const A = S.hostData, B = S.guestData;

  // 背景
  ctx.fillStyle = '#0a0912'; ctx.fillRect(0, 0, W, H);
  const g1 = ctx.createLinearGradient(0, 0, W, H);
  g1.addColorStop(0, '#141026'); g1.addColorStop(.55, '#0f0c1c'); g1.addColorStop(1, '#1a1024');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const blob = (x, y, rad, color, alpha) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = alpha; ctx.fillStyle = g;
    ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); ctx.globalAlpha = 1;
  };
  blob(140, 60, 520, '#5b3cff', .55);
  blob(980, 430, 480, '#ff3d78', .34);
  blob(160, 1330, 460, '#ff9c2e', .2);

  // 顶部
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.font = '600 26px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('默 契 度 测 试', W / 2, 104);
  ctx.fillStyle = 'rgba(255,255,255,.24)';
  ctx.font = '500 26px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(`${d.emoji} ${d.name}`, W / 2, 150);

  // 分数
  const sx = W / 2;
  const g2 = ctx.createLinearGradient(sx - 250, 380, sx + 250, 600);
  g2.addColorStop(0, '#a58bff'); g2.addColorStop(.5, '#ff6f9c'); g2.addColorStop(1, '#ffc06b');
  ctx.fillStyle = g2;
  ctx.font = '800 262px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(String(r.score), sx, 586);
  ctx.fillStyle = 'rgba(255,255,255,.34)';
  ctx.font = '600 30px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('分 · 默 契 度', sx, 648);

  // 等级
  ctx.fillStyle = '#fff';
  ctx.font = '700 66px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(`${t.e} ${t.t}`, sx, 742);
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '400 31px -apple-system, "PingFang SC", sans-serif';
  wrap(ctx, t.d, sx, 798, W - 220, 44);

  // 两人
  ctx.fillStyle = 'rgba(255,255,255,.86)';
  ctx.font = '600 42px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(`${A.n}  ×  ${B.n}`, sx, 902);
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.font = '400 27px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(`相似度 ${r.sim}%　·　${A.n} 猜中 ${r.aHit}/${r.n}　·　${B.n} 猜中 ${r.bHit}/${r.n}`, sx, 948);

  // 命中点阵：两行
  const dotRow = (label, hits, y) => {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.font = '400 26px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(label, 150, y - 18);
    for (let i = 0; i < r.n; i++) {
      const cx = 152 + i * 44, cy = y + 20;
      const on = r.rows[i][hits];
      ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2);
      if (on) {
        const g = ctx.createLinearGradient(cx - 15, cy - 15, cx + 15, cy + 15);
        g.addColorStop(0, '#7c5cff'); g.addColorStop(1, '#ff5c8a');
        ctx.fillStyle = g; ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fill();
      }
    }
    ctx.textAlign = 'center';
  };
  dotRow(`${A.n} 猜中`, 'A', 1046);
  dotRow(`${B.n} 猜中`, 'B', 1150);

  // 二维码
  const q = document.createElement('canvas');
  const link = S.resultLink || baseHref();
  const QS = 218;
  if (drawQR(q, link, QS)) {
    const qx = W - QS - 72, qy = H - QS - 96;
    ctx.fillStyle = '#fff';
    roundRect(ctx, qx - 16, qy - 16, QS + 32, QS + 32, 24); ctx.fill();
    ctx.drawImage(q, qx, qy, QS, QS);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '600 30px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('扫码也来测一次', 78, H - 132);
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.font = '400 22px ui-monospace, Menlo, monospace';
  ctx.fillText(link.replace(/^https?:\/\//, '').slice(0, 30) + '…', 78, H - 92);

  // 下载
  const name = `默契度-${A.n}x${B.n}-${r.score}分.jpg`.replace(/[\\/:*?"<>|]/g, '_');
  cv.toBlob(blob => {
    if (!blob) { toast('生成失败，试试截图'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已保存，微信里长按图片可转发');
  }, 'image/jpeg', 0.93);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(ctx, text, x, y, maxW, lh) {
  let line = '', n = 0;
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW && line) {
      ctx.fillText(line, x, y + n * lh); line = ch; n++;
    } else line += ch;
  }
  if (line) ctx.fillText(line, x, y + n * lh);
}

/* ---------------- 流程 ---------------- */
function startHost() {
  const inp = $('#nickin');
  S.nick = (inp && inp.value.trim()).slice(0, 12) || '我';
  store.set('nick', S.nick);
  S.self = []; S.guess = []; S.phase = 1; S.qi = 0; S.role = 'host';
  S.target = '';
  go('quiz');
}
function startGuest() {
  const inp = $('#nickin');
  S.nick = (inp && inp.value.trim()).slice(0, 12) || '我';
  store.set('nick', S.nick);
  S.self = []; S.guess = []; S.phase = 1; S.qi = 0; S.role = 'guest';
  S.deckId = S.incoming.deck;
  S.target = S.incoming.n;
  go('quiz');
}
function pick(i) {
  if (S.locked) return;
  const d = DECK(S.deckId);
  if (S.phase === 1) S.self[S.qi] = i; else S.guess[S.qi] = i;
  const opts = $('#opts');
  if (opts) opts.querySelectorAll('.opt').forEach((el, k) => el.classList.toggle('on', k === i));
  S.locked = true;
  setTimeout(() => { S.locked = false; nextQ(); }, 260);
}
function nextQ() {
  const d = DECK(S.deckId), n = d.qs.length;
  if (S.phase === 1 && S.qi >= n - 1) { S.phase = 2; S.qi = 0; return paintAll(); }
  if (S.phase === 2 && S.qi >= n - 1) return finish();
  S.qi++;
  paintAll();
}
function backQ() {
  const d = DECK(S.deckId), n = d.qs.length;
  if (S.phase === 2 && S.qi === 0) { S.phase = 1; S.qi = n - 1; return paintAll(); }
  if (S.qi === 0) { go(S.role === 'guest' ? 'invite' : 'nick'); return; }
  S.qi--; paintAll();
}
function paintAll() {
  if (S.v !== 'quiz') { render(); return; }
  const d = DECK(S.deckId), n = d.qs.length, total = n * 2;
  const done = S.phase === 1 ? S.qi : n + S.qi;
  const pill = document.querySelector('.quizbar .pill');
  if (pill) pill.textContent = S.phase === 1 ? '第 1 段 · 关于你' : '第 2 段 · 猜 ' + (S.target || 'TA');
  const bar = $('#prog'); if (bar) bar.style.width = Math.round(done / total * 100) + '%';
  paintQuestion();
}
function finish() {
  const d = DECK(S.deckId);
  if (S.role === 'host') { go('share'); return; }
  // guest：本地结算
  const host = { n: S.incoming.n, s: S.incoming.s, g: S.incoming.g };
  const guest = { n: S.nick, s: S.self, g: S.guess };
  S.hostData = host; S.guestData = guest;
  S.result = scoreOf(host, guest, d);
  S.resultLink = baseHref() + '#r=' + encResult(d.id, host, guest);
  saveHistory(host.n, guest.n, S.result.score, d.id);
  go('result');
}
function saveHistory(a, b, score, deck) {
  const h = store.get('history', []);
  h.unshift({ a, b, score, deck, ts: Date.now() });
  store.set('history', h.slice(0, 12));
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  switch (act) {
    case 'pickdeck':
      S.deckId = t.dataset.deck; S.nick = store.get('nick', '') || '';
      go('nick'); break;
    case 'starthost': startHost(); break;
    case 'startguest': startGuest(); break;
    case 'pick': pick(Number(t.dataset.i)); break;
    case 'backq': backQ(); break;
    case 'home':
      S.incoming = null; S.result = null; S.shareLink = null;
      clearHash(); go('home'); break;
    case 'copy':
      copyText(S.shareLink || '', '链接已复制，去粘给他'); break;
    case 'copybait':
      copyText(`我刚出了一套默契度测试《${DECK(S.deckId).name}》，10 道题，看看我们有多懂对方 👉 ${S.shareLink}`,
        '话术已复制，直接粘到微信'); break;
    case 'native': {
      const d = DECK(S.deckId).name;
      if (navigator.share) {
        navigator.share({ title: `默契度测试 · ${d}`, text: `${S.nick} 出了一套默契度测试，来答一下`, url: S.shareLink })
          .catch(() => {});
      } else copyText(S.shareLink, '这个浏览器不支持系统分享，链接已复制');
      break;
    }
    case 'sendresult':
      copyText(`我们测完了，默契度 ${S.result.score} 分 👉 ${S.resultLink}`, '结果链接已复制，发给他'); break;
    case 'poster': makePoster(); break;
    case 'again':
      S.result = null; S.incoming = null; S.shareLink = null; S.nick = store.get('nick', '');
      clearHash(); go('home'); break;
    case 'turn':
      S.incoming = null; S.result = null; S.nick = store.get('nick', '');
      clearHash(); go('nick'); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nickin') S.nick = e.target.value.slice(0, 12);
});
document.addEventListener('keydown', e => {
  if (S.v !== 'quiz') {
    if (e.key !== 'Enter') return;
    if (S.v === 'nick') { e.preventDefault(); startHost(); }
    if (S.v === 'invite') { e.preventDefault(); startGuest(); }
    return;
  }
  if (e.key >= '1' && e.key <= '4') { e.preventDefault(); pick(Number(e.key) - 1); }
  if (e.key === 'Backspace') { e.preventDefault(); backQ(); }
});

/* ---------------- 启动 ---------------- */
(function boot() {
  const h = location.hash || '';
  const mP = h.match(/^#p=(.+)$/), mR = h.match(/^#r=(.+)$/);
  if (mP) {
    const data = unpack(mP[1]);
    if (data) {
      S.incoming = data; S.deckId = data.deck; S.nick = store.get('nick', '');
      S.v = 'invite'; render(); return;
    }
  }
  if (mR) {
    const raw = unpackResult(mR[1]);
    if (raw) {
      S.deckId = raw.deck;
      S.hostData = raw.h; S.guestData = raw.u;
      S.result = scoreOf(raw.h, raw.u, DECK(raw.deck));
      S.resultLink = location.href;
      S.role = 'viewer';
      saveHistory(raw.h.n, raw.u.n, S.result.score, raw.deck);
      S.v = 'result'; render(); return;
    }
  }
  render();
})();
</script>
